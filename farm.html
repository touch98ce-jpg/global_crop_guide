function missionHarvestChoice(queue){ if (!queue.length) return afterMonth(); const { p, info, kg, bonusKg, baseNoNutri } = queue.shift(); const pr = priceAt(info, S.m, true) * (1 - D.const.farmgate_margin_rate), rev = Math.round(kg * pr), bonusRev = Math.round(bonusKg * pr), savedRev = Math.round(Math.max(0, kg - bonusKg - baseNoNutri) * pr); const storable = R.storable.includes(info.key) || R.storable.includes(info.name);

  card(t(`[수확] ${info.name} ${kgs}kg — 이달 농가수취가 ${perKg(pr)} → ${man(rev)} (경영비 ${man(p.cost)})${nc ? `\n  영양제 효과(설계값): 증수 +${Math.round(bonusKg)}kg = +${man(bonusRev)}${savedRev ? `, 피해 경감 +${man(savedRev)}` : ''} / 투입 ${man(nc)} → 순효과 ${man(bonusRev + savedRev - nc)}` : ''}`, `[Harvest] ${info.name} ${kgs}kg — farm-gate price ${perKg(pr)} → ${man(rev)} (cost ${man(p.cost)})${nc ? `\n  Nutrient effect (design value): +${Math.round(bonusKg)}kg = +${man(bonusRev)}${savedRev ? `, damage avoided +${man(savedRev)}` : ''} / spent ${man(nc)} → net ${man(bonusRev + savedRev - nc)}` : ''}`));

function nextMonth(){ if (S.over) return; const w = S.w; if (w.ev.includes('typhoon') && !S.flags['ty' + S.t]) { S.flags['ty' + S.t] = 1; return missionTyphoon(); } if (w.ev.includes('drought') && !S.flags['dr' + S.t]) { S.flags['dr' + S.t] = 1; return missionDrought(); } nextMonthCore(); }
function nextMonthCore(){ const w = S.w, KN = { cold: t('저온', 'cold'), heat: t('고온', 'heat'), drought: t('가뭄', 'drought'), storm: t('태풍·침수', 'storm/flood') }; const queue = [];
  for (const p of S.plots) { if (!p.crop) continue; const tp = p.info.temps, st = stageOf(p); let f = 1, f0 = 1; const stressCut = p.nutri.includes('stress') ? 1 - R.nutri.stress.dmgCut : 1; if (p.dmg0 == null) p.dmg0 = 1;
    const hit = (pct, k, reason) => { let cut = 1; if (k === 'cold' && p.cover) cut *= R.cover.cut; if (k === 'storm' && p.stake) cut *= R.stake.cut; if (k === 'drought' && p.irrig) cut = 0; const j = rngB(.5, 1.5); const g0 = 1 - pct * cut * j; const g = k === 'storm' ? g0 : 1 - pct * cut * j * stressCut; if (g0 < 1) f0 *= g0; if (g >= 1) return; f *= g; p.kind = k; p.notes.push({ y: S.y, m: S.m, k: KN[k], pct: Math.round((1-g)*100), reason }); say(t(`  ${p.info.name} ${KN[k]} 피해 −${Math.round((1-g)*100)}%  (${reason})${stressCut < 1 && k !== 'storm' ? ' · 영양제로 경감' : ''}`, `  ${p.info.name} ${KN[k]} damage −${Math.round((1-g)*100)}%  (${reason})${stressCut < 1 && k !== 'storm' ? ' · reduced by nutrient' : ''}`), 'bad'); };
    if (p.mode !== 'gh') { if (tp.freeze != null && w.tmin < tp.freeze) hit(R.dmg.freeze, 'cold', t(`최저 ${w.tmin.toFixed(1)}℃ < 동해 ${tp.freeze}℃`, `min ${w.tmin.toFixed(1)}℃ < frost kill ${tp.freeze}℃`)); else if (tp.low != null && w.tmin < tp.low) hit(R.dmg.low, 'cold', t(`최저 ${w.tmin.toFixed(1)}℃ < 한계 ${tp.low}℃`, `min ${w.tmin.toFixed(1)}℃ < limit ${tp.low}℃`));
      if (tp.heat != null && w.tmax > tp.heat && st === 3) hit(R.dmg.heatFlower, 'heat', t(`개화기 최고 ${w.tmax.toFixed(1)}℃ > ${tp.heat}℃`, `flowering, max ${w.tmax.toFixed(1)}℃ > ${tp.heat}℃`)); else if (tp.high != null && w.ta > tp.high) hit(R.dmg.high, 'heat', t(`평균 ${w.ta.toFixed(1)}℃ > 상한 ${tp.high}℃`, `mean ${w.ta.toFixed(1)}℃ > upper limit ${tp.high}℃`));
      if (w.ta > 10 && w.rain < w.rainN * .5) hit(R.dmg.dry, 'drought', t(`비 ${Math.round(w.rain)}mm, 평년의 절반 미만`, `rain ${Math.round(w.rain)}mm, under half of normal`)); if (w.ta > 10 && w.rain > w.rainN * 2) hit(R.dmg.wet, 'storm', t(`비 ${Math.round(w.rain)}mm, 평년 2배 초과`, `rain ${Math.round(w.rain)}mm, over twice normal`));
      if (w.ev.includes('typhoon') || w.ev.includes('hail')) hit(R.dmg.storm, 'storm', evNames(w.ev)); }
    else { if (w.ev.includes('typhoon') || w.ev.includes('hail')) hit(R.dmg.stormGh, 'storm', t('하우스 파손', 'greenhouse damage')); if (w.ta < 5) pay(Math.round(R.heating * R.area10a), t('난방비', 'heating')); }
    if (f < 1) { p.dmg = Math.max(R.dmg.floor, p.dmg * f); SFX.bad(); } else p.kind = 'none'; if (f0 < 1) p.dmg0 = Math.max(R.dmg.floor, p.dmg0 * f0); p.el++; p.irrig = false;
    if (p.el >= p.dur) { let base = p.info.yld * R.area10a * soilK(p, p.info) * R.fert[p.fert].k; if (p.prev === p.crop) base *= R.replantSame; else if (p.prev && p.info.family && (D.catalog.find(c => c.key === p.prev) || {}).family === p.info.family) base *= R.replantFamily; const withDmg = base * p.dmg, bonusKg = withDmg * (p.nutriBonus || 0); queue.push({ p, info: p.info, kg: withDmg + bonusKg, bonusKg, baseNoNutri: base * p.dmg0 }); } }
  S.store.forEach(s => s.kg *= 1 - R.storeLoss);
  const it = Math.round(S.policy * R.loan.policyRate / 12 + S.op * R.loan.opRate / 12); if (it > 0) { pay(it, t('이자', 'interest')); (S.years[S.y-1] ||= {rev:0,cost:0}).cost += it; } if (S.op > 0 && S.cash > 0) { const r = Math.min(S.op, S.cash); S.op -= r; S.cash -= r; }
  S.plots.forEach(p => { if (p.crop && p.el === 1) (S.years[S.y-1] ||= {rev:0,cost:0}).cost += p.cost; });
  missionHarvestChoice(queue); }
function afterMonth(){ if (S.m === 12) yearEnd(); S.t++; S.m = S.m % 12 + 1; if (S.m === 1) S.y++; if (S.over === 'loan' || S.t >= 36) return ending(); rollWeather(); const stage = S.m <= 5 ? t('봄', 'spring') : S.m <= 9 ? t('여름', 'summer') : t('가을·겨울', 'autumn/winter'); card(t(`[${S.y}년차 ${stage}] ${S.y}년차 ${S.m}월`, `[Year ${S.y} ${stage}] Year ${S.y}, month ${S.m}`)); weatherLine(); if (S.m === 1) npc(NPC.otter(), t('1월입니다. 하우스 보조사업 신청은 "보조".', 'January. Greenhouse subsidy: "subsidy".')); if (S.m === 2 && S.y === 2) npc(NPC.chief(), t('작년에 심은 작물을 같은 밭에 또 심으면 연작 장해로 수량이 줍니다(같은 작물 −25%, 같은 과 −15%).', 'Replanting last year\'s crop in the same field cuts yield (same crop −25%, same family −15%).')); status(); prompt(); }
function yearEnd(){ const y = S.years[S.y-1] || {rev:0,cost:0}; card(t(`[결산] ${S.y}년차 — 조수입 ${man(y.rev)} · 경영비·이자 ${man(y.cost)} · 순수익 ${man(y.rev - y.cost)} · 현금 ${man(S.cash)}${S.nutriSpent ? `\n영양제(설계값): 지출 ${man(S.nutriSpent)} → 증수 ${man(S.nutriGain)} + 피해 경감 ${man(S.nutriSaved)} = 순효과 ${man(S.nutriGain + S.nutriSaved - S.nutriSpent)}` : ''}`, `[Year-end] Year ${S.y} — revenue ${man(y.rev)} · costs+interest ${man(y.cost)} · net ${man(y.rev - y.cost)} · cash ${man(S.cash)}${S.nutriSpent ? `\nNutrients (design values): spent ${man(S.nutriSpent)} → extra yield ${man(S.nutriGain)} + damage avoided ${man(S.nutriSaved)} = net ${man(S.nutriGain + S.nutriSaved - S.nutriSpent)}` : ''}`)); npc(NPC.chief(), y.rev - y.cost > 0 ? t('첫해 치고 괜찮네요.', 'Not bad for a year.') : t('농사가 원래 첫해엔 적자예요. 내년을 봅시다.', 'Farming usually loses money early on. On to next year.')); }
const houseResidual = () => S.house ? Math.round(S.houseCost * Math.max(0, 1 - (S.t - S.houseMonth) / R.house.life)) : 0;
function ending(){ S.over = S.over || 'end'; const storeVal = S.store.reduce((a, s) => a + s.kg * basePrice(s.info, 12) * (1 - D.const.farmgate_margin_rate), 0); const sc = S.cash + storeVal + houseResidual() - S.policy - S.op - S.cap; const r = sc / S.cap;
  const end = S.over === 'loan' ? [t('다시 도시로', 'Back to the city'), t('빚이 한도를 넘었다. 밭을 내놓고 서울행 버스를 탔다. 그래도 3년 농사는 몸에 남았다.', 'Debt hit the ceiling. You gave up the fields and took the bus to Seoul. Three years of farming stay in your hands, though.')] : r > .5 ? [t('하우스 부자', 'Greenhouse tycoon'), t('마을에서 제일 먼저 하우스 불을 켜는 집이 됐다. 이장님이 후계자감이라며 웃는다.', 'Yours is the first greenhouse lit each morning. The chief calls you a successor.')] : r > 0 ? [t('정착', 'Settled'), t('3년 만에 본전은 넘겼다. 내년엔 밭을 한 칸 더 빌리기로 했다.', 'You beat break-even in three years. Next year, one more field.')] : [t('버티기', 'Hanging on'), t('통장은 줄었지만 밭은 남았다. 한 해만 더 해보기로 한다.', 'The bank balance shrank, but the fields are still yours. One more year.')];
  card(t(`══ 3년 농사 끝 ══  엔딩: ${end[0]}\n현금 ${fmt(S.cash)} + 창고 ${fmt(storeVal)} + 하우스 잔존 ${fmt(houseResidual())} − 빚 ${fmt(S.policy + S.op)} − 자본금 ${fmt(S.cap)}\n번 돈(점수): ${fmt(sc)}\n${S.nutriSpent ? `영양제(설계값): 지출 ${man(S.nutriSpent)} → 증수 ${man(S.nutriGain)} + 피해 경감 ${man(S.nutriSaved)} = 순효과 ${man(S.nutriGain + S.nutriSaved - S.nutriSpent)}\n` : ''}`, `══ Three years are up ══  Ending: ${end[0]}\nCash ${fmt(S.cash)} + storage ${fmt(storeVal)} + greenhouse residual ${fmt(houseResidual())} − debt ${fmt(S.policy + S.op)} − capital ${fmt(S.cap)}\nMoney made (score): ${fmt(sc)}\n${S.nutriSpent ? `Nutrients (design values): spent ${man(S.nutriSpent)} → extra yield ${man(S.nutriGain)} + damage avoided ${man(S.nutriSaved)} = net ${man(S.nutriGain + S.nutriSaved - S.nutriSpent)}\n` : ''}`) + S.years.map((y, i) => t(`${i+1}년차 순수익 ${man(y.rev - y.cost)}`, `Y${i+1} net ${man(y.rev - y.cost)}`)).join(' · ')); say(end[1], 'hi'); ask([{ label: t('새 게임', 'New game'), fn: newGame }], null); }
// ===== 입력·언어 =====
$('#f').onsubmit = e => { e.preventDefault(); handle($('#cmd').value); };
$('#mute').onclick = () => { SFX.on = !SFX.on; $('#mute').textContent = SFX.on ? '🔊' : '🔇'; };
function setLang(l, quiet){ LANG = l; $('#lang').textContent = l === 'ko' ? 'EN' : '한국어'; $('#h1').textContent = t('나 다시 돌아갈래 — 채팅 농사', 'Back to the Land — Chat Farm'); $('#cmd').placeholder = t('번호 또는 명령 (도움: ?)', 'number or command (help: ?)'); $('#send').textContent = t('입력', 'Enter'); document.title = $('#h1').textContent; if (S) { S.plots.forEach(p => { if (p.crop) p.info = cropInfo(findCrop(p.crop) || D.catalog.find(c => c.key === p.crop) || { name: p.crop, grade: 'generic', cat: 'leaf' }, p.mode === 'gh' ? 'gh' : 'open'); }); status(); if (!quiet) { say(t('(한국어로 바꿨습니다)', '(switched to English)'), 'sys'); if (!UI.pending) prompt(); } } }
$('#lang').onclick = () => setLang(LANG === 'ko' ? 'en' : 'ko');
window.addEventListener('resize', drawPanel);
(function boot(){ say('언어 / Language', 'sys'); UI.pending = { choices: [{ label: '한국어', fn: () => { setLang('ko', true); newGame(); } }, { label: 'English', fn: () => { setLang('en', true); newGame(); } }], free: x => { if (/^(불러오기|load)/i.test(x)) { try { S = JSON.parse(decodeURIComponent(escape(atob(x.replace(/^(불러오기|load)\s*/i, '').trim())))); S.nutriSpent ??= 0; S.nutriGain ??= 0; S.nutriSaved ??= 0; S.plots.forEach(p => { p.nutri ??= []; p.nutriBonus ??= 0; if (p.crop) p.info = cropInfo(findCrop(p.crop) || D.catalog.find(c => c.key === p.crop), p.mode === 'gh' ? 'gh' : 'open'); }); say(t('이어 합니다.', 'Resuming.')); status(); prompt(); } catch (e) { say(t('코드를 읽을 수 없습니다.', 'Could not read the code.'), 'bad'); } } else { setLang('ko', true); newGame(); } } }; const b = $('#choices'); [['1. 한국어', '1'], ['2. English', '2']].forEach(([l, v]) => { const x = document.createElement('button'); x.type = 'button'; x.textContent = l; x.onclick = () => handle(v); b.appendChild(x); }); })();
