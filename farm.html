:root{--bg:#0b1410;--fg:#cfe8c8;--dim:#7f9b7a;--hi:#ffe08a;--acc:#6fd27a;--bad:#ff8a7a;--line:#24402c;--panel:#101e16;--font:'Nanum Gothic Coding','D2Coding',ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}

:root[data-theme="light"]{--bg:#0b1410;--fg:#cfe8c8}
html{height:100%;height:-webkit-fill-available}body{box-sizing:border-box;height:100vh;height:-webkit-fill-available;height:100dvh;overflow:hidden;overflow-x:hidden;max-width:100vw;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));margin:0;overscroll-behavior:none;position:fixed;inset:0;width:100%}
main{max-width:640px;margin:0 auto;height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:6px;min-height:0;position:relative;will-change:transform}
#top{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:6px;display:grid;grid-template-columns:5fr 6fr;gap:6px;height:150px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#fieldCv,#sceneCv{width:100%;height:100%;display:block;border-radius:4px}
#fieldWrap,#sceneWrap{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#0a120d}
#sceneWrap{position:relative}
#sceneMsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--hi);font-size:13px;line-height:1.5;padding:8px;pointer-events:none}
#sceneMsg button{pointer-events:auto;font:inherit;background:var(--acc);color:#07200c;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}
header{display:flex;justify-content:space-between;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding-bottom:4px;font-size:12px;color:var(--dim);flex-wrap:wrap;line-height:1.3}
header b{color:var(--hi);font-weight:400}
#log{overflow:auto;min-height:0;white-space:pre-wrap;line-height:1.55;padding-right:4px}

#log .src{color:var(--dim);font-size:12px;word-break:break-all}
.in{display:grid;gap:6px}
.choices{display:flex;flex-wrap:wrap;gap:6px;max-height:30vh;max-height:30dvh;overflow:auto}
@media (max-height:680px){#top{height:120px}.choices{max-height:24dvh}header{font-size:11px}}
/* 키보드가 올라온 상태(visualViewport가 줄어듦): 그림판을 접고 로그를 살린다 */
html.kbd #top{height:84px}html.kbd header{font-size:11px;padding-bottom:2px}html.kbd .choices{max-height:22vh}
@media (max-width:400px){#top{grid-template-columns:4fr 6fr}form button#send{display:none}}
.choices button{font:inherit;font-size:13px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;text-align:left}
.choices button:hover,.choices button:focus-visible{border-color:var(--acc);outline:none}
form{display:flex;gap:6px;flex-wrap:nowrap}form span{color:var(--acc);padding:8px 0}form button{white-space:nowrap}
input{flex:1;min-width:0;font:inherit;font-size:16px;background:var(--panel);color:var(--hi);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
input:focus-visible{outline:none;border-color:var(--acc)}
form button{font:inherit;background:var(--acc);color:#07200c;border:0;border-radius:6px;padding:8px 12px;cursor:pointer}
form button.next{background:var(--hi);display:none}
.npcrow{display:flex;gap:6px;align-items:flex-start}.npcrow canvas{width:26px;height:26px;flex:none;margin-top:2px}
#log .hint{color:var(--hi);border-left:3px solid var(--hi);padding-left:8px}
.mute{font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:2px 8px;cursor:pointer}

function mission0_person(){ card(t('[0단계] 귀농 준비 — 농부 모습', '[Stage 0] Getting ready — your farmer')); npc(NPC.chief(), t('명부에 사진도 붙여야 해요. 성별과 나이대를 골라요.', 'The register needs a photo too. Pick gender and age.'));
  const opts = []; [['m', '남', 'Man'], ['f', '여', 'Woman']].forEach(([g, ko, en]) => [20, 30, 40, 50, 60].forEach(a => opts.push({ label: t(`${ko} ${a}대`, `${en}, ${a}s`), fn: () => { S.gender = g; S.age = a; status(); mission0_quick(); } })));
  ask(opts, x => { S.gender = /여|f|w/i.test(x) ? 'f' : 'm'; const a = parseInt(x.replace(/[^0-9]/g, '')); S.age = isNaN(a) ? 30 : Math.min(60, Math.max(20, Math.floor(a / 10) * 10)); status(); mission0_quick(); }); }
function mission0_quick(){ if (S.replay) return startYear(); card(t('[0단계] 귀농 준비 — 어디서, 얼마로', '[Stage 0] Getting ready — where and with how much')); npc(NPC.otter(), t('바로 시작할까요, 아니면 지역·자본금·난이도를 직접 고를까요?', 'Quick start, or choose region, capital and difficulty yourself?'));
  ask([{ label: t('빠른 시작 (홍천 · 3,000만원 · 보통)', 'Quick start (Hongcheon · $20,000 · Normal)'), fn: () => { S.region = null; S.cap = S.cash = LANG === 'en' ? 20000 * FX : 3e7; S.diffKey = 'normal'; startYear(); } }, { label: t('직접 고른다 (지역 → 자본금 → 난이도)', 'Choose myself (region → capital → difficulty)'), fn: mission0_region }]); }
// ===== 지역 고르기 (Open-Meteo 지오코딩 + ERA5 10년 월평균; 서버 없이 브라우저가 직접 호출) =====
function mission0_region(){ card(t('[0단계] 귀농 준비 — 지역', '[Stage 0] Getting ready — region')); npc(NPC.chief(), t('어디로 내려올 거예요? 홍천이면 기상청 평년값을 쓰고, 다른 곳은 지명을 치면 세계 기상 자료(Open-Meteo, 2014–2023)에서 월별 기온·비를 가져와요.', 'Where are you moving to? Hongcheon uses KMA climate normals; for anywhere else type a place name and I fetch monthly temperature and rain from Open-Meteo (2014–2023).'));
  ask([{ label: t('홍천 (기본, 기상청 평년값)', 'Hongcheon, Korea (default, KMA normals)'), fn: () => { S.region = null; mission0_cap(); } }], q => searchRegion(q), t('또는 지명 입력: 평택, 제주, Hokkaido, Da Lat…', 'or type a place: Pyeongtaek, Jeju, Hokkaido, Da Lat…')); }
async function searchRegion(q){ say(t(`"${q}" 찾는 중…`, `Searching "${q}"…`), 'sys'); let res;
  try { // 1차 OpenStreetMap Nominatim(지명 폭넓음, 1초 1회) → 2차 Open-Meteo 지오코딩
    try { const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=jsonv2&limit=6&accept-language=${LANG === 'ko' ? 'ko,en' : 'en'}`); const j = await r.json(); res = (j || []).map(g => { const parts = g.display_name.split(',').map(x => x.trim()); const mid = parts.slice(1, -1); return { name: g.name || parts[0], admin1: mid.slice(0, 2).join(', '), country: parts.length > 1 ? parts[parts.length - 1] : '', latitude: +g.lat, longitude: +g.lon }; }); } catch (e) { res = null; }
    if (!res) { const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=${LANG}`); res = (await r.json()).results || []; } } catch (e) { say(t('지역 검색 서버(Open-Meteo)에 연결하지 못했습니다. 오프라인이거나, 이 페이지를 띄운 곳이 외부 접속을 막고 있을 수 있어요(claude.ai 테스트판 안에서는 막힙니다 — 파일을 직접 열거나 GitHub Pages에 올리면 됩니다). 홍천으로 시작합니다.', 'Could not reach the geocoding service (Open-Meteo). You may be offline, or the host of this page blocks outside connections (the claude.ai test page does; open the file directly or host it on GitHub Pages). Starting in Hongcheon.'), 'bad'); S.region = null; return mission0_region2(); }
  if (!res.length) { npc(NPC.chief(), t('그런 곳은 지도에 없네요. 다시 써 볼래요?', 'Not on my map. Try another spelling?')); return mission0_region(); }
  ask(res.map(g => ({ label: [g.name, g.admin1, g.country].filter(Boolean).join(', ') + ` (${g.latitude.toFixed(2)}, ${g.longitude.toFixed(2)})`, fn: () => loadRegion(g) })).concat([{ label: t('다시 검색', 'Search again'), fn: mission0_region }]), q2 => searchRegion(q2)); }
async function loadRegion(g){ say(t(`${g.name} 10년 기상 자료 내려받는 중…`, `Downloading 10 years of weather for ${g.name}…`), 'sys');
  try { const r = await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${g.latitude}&longitude=${g.longitude}&start_date=2014-01-01&end_date=2023-12-31&daily=temperature_2m_mean,temperature_2m_min,temperature_2m_max,precipitation_sum&timezone=auto`); const d = (await r.json()).daily; if (!d || !d.time) throw 0;
    const acc = Array.from({length: 12}, () => ({ ta: 0, tmin: 0, tmax: 0, rain: 0, n: 0, yrs: new Set() }));
    d.time.forEach((day, i) => { const m = +day.slice(5, 7) - 1, a = acc[m]; if (d.temperature_2m_mean[i] == null) return; a.ta += d.temperature_2m_mean[i]; a.tmin += d.temperature_2m_min[i]; a.tmax += d.temperature_2m_max[i]; a.rain += d.precipitation_sum[i] || 0; a.n++; a.yrs.add(day.slice(0, 4)); });
    const months = acc.map((a, i) => ({ m: i + 1, ta: +(a.ta / a.n).toFixed(1), tmin: +(a.tmin / a.n).toFixed(1), tmax: +(a.tmax / a.n).toFixed(1), rain: Math.round(a.rain / a.yrs.size) }));
    S.region = { ko: g.name, en: g.name, admin: [g.admin1, g.country].filter(Boolean).join(', '), lat: g.latitude, lon: g.longitude, months, src: 'Open-Meteo ERA5 2014–2023 (CC BY 4.0)' };
    card(t(`${g.name} (${S.region.admin}) — 월평균 기온/최저/최고/비\n`, `${g.name} (${S.region.admin}) — monthly mean/min/max temp, rain\n`) + months.map(x => `${x.m}${t('월', '')}: ${x.ta}/${x.tmin}/${x.tmax}℃ ${x.rain}mm`).join('  ') + t('\n자료: Open-Meteo(ERA5 재분석) 2014–2023 평균, 지명 OpenStreetMap. 작물 소득·경영비·가격·토양 적합도는 한국(KOSIS·KAMIS·홍천 토양) 기준 그대로이니 다른 나라에서는 참고값입니다.', '\nSource: Open-Meteo (ERA5 reanalysis), 2014–2023 means; place names OpenStreetMap. Crop income, costs, prices and soil suitability stay Korean (KOSIS, KAMIS, Hongcheon soil), so outside Korea treat them as reference values.'));
    say(t(`지도: https://www.google.com/maps?q=${g.latitude},${g.longitude}`, `Map: https://www.google.com/maps?q=${g.latitude},${g.longitude}`), 'src'); SFX.ok(); mission0_cap(); }
  catch (e) { say(t('기상 자료를 받지 못했습니다(외부 접속 차단 또는 오프라인). 홍천으로 시작합니다.', 'Could not download the weather data (outside connections blocked, or offline). Starting in Hongcheon.'), 'bad'); S.region = null; mission0_cap(); } }
function mission0_region2(){ ask([{ label: t('홍천으로 시작', 'Start in Hongcheon'), fn: mission0_cap }, { label: t('지역 검색 다시 시도', 'Try the search again'), fn: mission0_region }]); }
function mission0_cap(){ card(t('[0단계] 귀농 준비 — 자본금과 밭', '[Stage 0] Getting ready — capital and fields')); npc(NPC.otter(), t(`귀농 자금은 얼마나 준비하셨어요? 밭 900평(300평씩 3칸)은 임차로 잡아 뒀습니다. 토질은 ${S.plots.map((p, i) => (i+1) + '번 ' + R.soil[p.soil].ko).join(', ')} — 땅은 나오는 대로예요.`, `How much capital did you bring? I have three rented fields of 0.1 ha (300 pyeong) each lined up. Soil: ${S.plots.map((p, i) => (i+1) + ' ' + R.soil[p.soil].en).join(', ')} — the land is whatever the landlord had.`));
  if (LANG === 'en') return ask([10000, 20000, 30000, 40000, 50000].map(d => ({ label: `$${d.toLocaleString('en-US')}`, fn: () => { S.cap = S.cash = d * FX; mission0_diff(); } })), x => { const d = parseInt(x.replace(/[^0-9]/g, '')); S.cap = S.cash = Math.min(50000, Math.max(5000, isNaN(d) ? 20000 : d)) * FX; mission0_diff(); }, 'or type an amount in $ (5,000–50,000)');
  ask([1,2,3,4,5].map(n => ({ label: `${n},000만원`, fn: () => { S.cap = S.cash = n * 1e7; mission0_diff(); } })), x => { const n = parseInt(x.replace(/[^0-9]/g, '')); S.cap = S.cash = Math.min(5, Math.max(1, isNaN(n) ? 3 : (n > 100 ? Math.round(n / 1000) : n))) * 1e7; mission0_diff(); }); }
function mission0_diff(){ card(t('[0단계] 귀농 준비 — 난이도', '[Stage 0] Getting ready — difficulty')); ask(Object.entries(R.diff).map(([k, d]) => ({ label: t(`${d.ko} — 날씨 폭 ${d.w[0]}~${d.w[1]}배, 병충해 ×${d.pest}, 가격 변동 ×${d.price}`, `${d.en} — weather ${d.w[0]}–${d.w[1]}×, pests ×${d.pest}, price swings ×${d.price}`), fn: () => { S.diffKey = k; startYear(); } }))); }
function startYear(){ if (S.replay && S.replay.cap) { S.cap = S.cash = S.replay.cap; S.diffKey = S.replay.diff || 'normal'; } S.nb = nbInit(); rollWeather(); card(t(`[1단계] 첫 봄 — ${RNAME()} · ${S.y}년차 ${S.m}월 · 자본금 ${man(S.cap)} · 난이도 ${DIFF().ko}`, `[Stage 1] First spring — ${RNAME()} · Year ${S.y}, month ${S.m} · capital ${man(S.cap)} · ${DIFF().en}`)); yearMissionCard();
  npc(NPC.otter(), t('지난 1월에 하우스 보조사업(설치비 50%)을 신청해 두셨어요? 결과는 지금 나와요.', 'Did you apply for the greenhouse subsidy (50% of cost) back in January? Results are out now.'));
  ask([{ label: t('신청했다 (선정 확률 60%)', 'Yes, I applied (60% chance)'), fn: () => { S.subsidyTried = S.y; const ok = rng() < R.house.subsidyP; S.houseSub = ok; npc(NPC.otter(), ok ? t('선정됐어요! 올해 안에 "하우스"로 짓는 첫 한 동은 설치비 절반을 보조받습니다.', 'Selected! Half the cost of the first house you build with "house" this year is covered.') : t('아쉽게 떨어졌어요. 내년 1월에 다시 신청할 수 있어요.', 'Not selected. You can apply again next January.')); if (ok) SFX.ok(); tutorialStart(); } }, { label: t('안 했다', 'No'), fn: tutorialStart }]); }
function tutorialStart(){ npc(NPC.chief(), t('밭 세 칸은 다 풀밭이에요. 첫 수확까지는 제가 옆에서 알려 드릴게요 — 그동안은 날씨 피해도 병충해도 봐줍니다(연습 기간).', 'All three fields are still grass. I will walk you through to your first harvest — no weather damage or pests until then (practice period).')); weatherLine(); monthlyBrief(); status(); prompt(); }
// ===== 이달 할 수 있는 일 — 이장님 브리핑 =====
function monthlyBrief(){ const L = []; const untilled = S.plots.map((p, i) => !p.tilled ? i + 1 : 0).filter(Boolean); const empties = S.plots.map((p, i) => p.tilled && !p.crop ? i : -1).filter(i => i >= 0);
  if (untilled.length) L.push(t(`개간: ${untilled.join('·')}번 밭이 아직 풀밭 → "개간"`, `Till: field ${untilled.join(', ')} still grass → "till"`));
  if (empties.length) { const seen = new Set(); const names = []; empties.forEach(i => { const mode = S.plots[i].mode === 'gh' ? 'gh' : 'open'; D.catalog.forEach(c => { if (c.grade === 'generic' || seen.has(c.key)) return; const info = cropInfo(c, mode); if (info.plant.includes(S.m) && !(mode === 'open' && info.ghOnly)) { seen.add(c.key); names.push({ n: info.name, g: info.grade }); } }); }); const ord = { curated: 0, auto: 1, world: 2 }; names.sort((a, b) => ord[a.g] - ord[b.g]); L.push(names.length ? t(`심기: 빈 밭 ${empties.map(i => i + 1).join('·')}번 — 이달 심을 수 있는 작물 ${names.slice(0, 5).map(x => x.n).join(', ')}${names.length > 5 ? ' 등 ' + names.length + '종' : ''} → "심기"`, `Plant: empty field ${empties.map(i => i + 1).join(', ')} — this month you can plant ${names.slice(0, 5).map(x => x.n).join(', ')}${names.length > 5 ? ' and ' + (names.length - 5) + ' more' : ''} → "plant"`) : t(`심기: 빈 밭 ${empties.map(i => i + 1).join('·')}번 — 이달 노지에 심을 작물이 없음(하우스면 가능). "심기"로 다음 달 작물 확인`, `Plant: empty field ${empties.map(i => i + 1).join(', ')} — nothing for the open field this month (a greenhouse would allow it). "plant" shows what comes next`)); }
  S.plots.forEach((p, i) => { if (!p.crop) return; const st = stageOf(p), left = p.dur - p.el; L.push(t(`${i+1}번 ${p.info.name}: ${st}/4단계, ${left}개월 뒤 수확${st <= 3 && !p.nutri.includes('fruit') ? ' · 영양제(비대 촉진제) 줄 수 있음' : ''}${p.fert !== 'full' ? ' · 비료 보충 가능' : ''}`, `Field ${i+1} ${p.info.name}: stage ${st}/4, harvest in ${left} mo${st <= 3 && !p.nutri.includes('fruit') ? ' · nutrient (fruit-set booster) still possible' : ''}${p.fert !== 'full' ? ' · can top up fertilizer' : ''}`)); });
  if (S.plots.some(p => p.tilled && p.mode !== 'gh')) { const own = S.houseSub ? R.house.cost * .5 : R.house.cost; L.push(t(`하우스: 한 동 ${man(own)}${S.houseSub ? '(보조 적용)' : ''}${S.cash >= own ? ' — 현금으로 가능' : ' — 창업자금 대출 필요'} → "하우스"`, `Greenhouse: ${man(own)} per house${S.houseSub ? ' (subsidy applied)' : ''}${S.cash >= own ? ' — affordable in cash' : ' — needs the start-up loan'} → "house"`)); }
  if (S.m === 1 && S.subsidyTried !== S.y) L.push(t('1월: 하우스 보조사업 신청 가능 → "보조"', 'January: apply for the greenhouse subsidy → "subsidy"'));
  if (S.y >= 2 && S.plots.length < R.maxPlots) L.push(t(`밭 임차: 한 칸 더 빌릴 수 있음(연 ${man(R.rent)}) → "임차"`, `Rent: one more field available (${man(R.rent)}/yr) → "rent"`));
  if (S.store.length) L.push(t(`창고: ${S.store.map(x => x.name + ' ' + Math.round(x.kg) + 'kg').join(', ')} — 이달 시세 ${S.store.map(x => perKg(basePrice(x.info, S.m) * (1 - D.const.farmgate_margin_rate))).join(', ')} → "팔기"`, `Storage: ${S.store.map(x => x.name + ' ' + Math.round(x.kg) + 'kg').join(', ')} — this month ${S.store.map(x => perKg(basePrice(x.info, S.m) * (1 - D.const.farmgate_margin_rate))).join(', ')} → "sell"`));
  if (S.policy > 0 && S.cash > S.policy) L.push(t(`창업자금 ${man(S.policy)} 갚을 수 있음 → "상환"`, `You can repay the ${man(S.policy)} start-up loan → "repay"`));
  if (!S.plots.some(p => p.crop) && !empties.length && !untilled.length) L.push(t('할 일 없음 → "다음"', 'Nothing to do → "next"'));
  if (S.plots.some(p => p.crop) && !empties.length && !untilled.length) L.push(t('기다리기: "다음" 또는 수확까지 "건너뛰기"', 'Wait: "next", or "skip" to the harvest'));
  npc(NPC.chief(), t(`이달 할 수 있는 일:\n  · ` + L.join('\n  · '), `This month you can:\n  · ` + L.join('\n  · '))); }
function tutHint(){ if (!S || !S.tut) return null; if (!S.plots.some(p => p.tilled)) return t('▶ 먼저 "개간"을 눌러 밭을 갈아요 (휴대폰을 흔들거나 그림판을 쓸어내리기)', '▶ First press "till" to break ground (swing the phone or swipe the panel)'); if (!S.plots.some(p => p.crop)) return t('▶ 이제 "심기"로 작물을 고르세요. 감자(3개월)가 첫 작물로 무난해요', '▶ Now press "plant" and pick a crop. Potato (3 months) is a safe first crop'); return t('▶ "다음 달로"를 눌러 시간을 보내요. 수확 때 첫 돈이 들어옵니다', '▶ Press "next month" to move on. Your first money comes at harvest'); }
function yearMissionCard(){ const m = YM[S.y - 1]; if (m) card(t(`[${S.y}년차 미션] ${m.ko}`, `[Year ${S.y} mission] ${m.en}`)); }
const YM = [{ ko: '첫 흑자 — 수확 하나라도 경영비보다 많이 팔기', en: 'First profit — sell one harvest for more than it cost', chk: () => S.log.some(l => /순수익 [^−]|net \$[^−]/.test(l)) }, { ko: '하우스 짓기 또는 작물 3종 재배', en: 'Build a greenhouse or grow 3 different crops', chk: () => S.house || new Set(S.harvested || []).size >= 3 }, { ko: '자본금의 1.5배 만들기', en: 'Reach 1.5× your starting capital', chk: () => S.cash + houseResidual() - S.policy - S.op >= S.cap * 1.5 }];
// ===== 매달 =====

  const p = S.plots[pi]; if (!p) { say(t('빈 밭이 없거나 번호가 틀립니다. (밭 명령으로 확인)', 'No empty field or wrong number (see "fields").'), 'sys'); return prompt(); }
  if (!p.tilled) { say(t(`${pi+1}번 밭은 아직 황무지입니다. 먼저 "개간 ${pi+1}"`, `Field ${pi+1} is untilled. First "till ${pi+1}".`), 'sys'); return prompt(); } if (p.crop) { say(t(`${pi+1}번 밭에는 ${J(p.info.name,'이','가')} 자라고 있습니다.`, `${p.info.name} is growing in field ${pi+1}.`), 'sys'); return prompt(); }
  const c = findCrop(q); if (!c) return unknownCrop(q, pi);
  const mode = p.mode === 'gh' ? 'gh' : 'open', info = cropInfo(c, mode);
  if (mode === 'open' && info.ghOnly) { npc(NPC.chief(), t(`${J(info.name,'은','는')} ${RNAME()} 노지에서는 못 키워요. ${info.note || ''} 하우스가 있어야 합니다.`, `${info.name} won't survive outdoors in ${RNAME()}. ${info.note || ''} You need a greenhouse.`)); return prompt(); }
  if (!info.plant.includes(S.m)) { npc(NPC.chief(), t(`${J(info.name,'은','는')} ${S.m}월에 심는 작물이 아니에요. 심는 달: ${info.plant.join('·')}월${info.grade === 'auto' ? ' (설계값, 검토 전)' : info.grade === 'world' ? ' (해외 자료 기준 추정)' : ''}.`, `${info.name} isn't planted in month ${S.m}. Planting months: ${info.plant.join('·')}${info.grade === 'auto' ? ' (design value, unreviewed)' : info.grade === 'world' ? ' (estimate from overseas sources)' : ''}.`)); return prompt(); }
  describeCrop(info, p); askPlantOptions(pi, info); }
function askPlantOptions(pi, info){ npc(NPC.chief(), t('비료는 어떻게 줄래요?', 'How much fertilizer?')); ask([{ label: t(`처방대로 (비료비 ${man(info.fert * R.area10a)})`, `As prescribed (fertilizer ${man(info.fert * R.area10a)})`), fn: () => askPest('full') }, { label: t(`절반 (수량 85%, ${man(info.fert * R.area10a * .5)})`, `Half (yield 85%, ${man(info.fert * R.area10a * .5)})`), fn: () => askPest('half') }, { label: t('안 줌 (수량 60%)', 'None (yield 60%)'), fn: () => askPest('none') }, { label: t('그만둔다', 'Cancel'), fn: prompt }]);
  function askPest(fert){ npc(NPC.chief(), t('농약(방제)은요? 병충해 피해가 달라져요. — 설계값', 'And pesticide? It changes pest damage. — design value')); ask(Object.entries(R.pesticide).map(([k, v]) => ({ label: t(`${v.ko} (병충해 피해 ${Math.round(v.k*100)}%, 농약비 ${man(info.pest * R.area10a * v.cost)}) → 총 경영비 ${man(plantCost(info, fert, k))}`, `${v.en} (pest damage ${Math.round(v.k*100)}%, pesticide ${man(info.pest * R.area10a * v.cost)}) → total cost ${man(plantCost(info, fert, k))}`), fn: () => doPlant(pi, info, fert, k) })).concat([{ label: t('그만둔다', 'Cancel'), fn: prompt }])); } }
function listCrops(pi){ const p = S.plots[pi], mode = p.mode === 'gh' ? 'gh' : 'open'; const rows = [];
  for (const c of D.catalog) { if (c.grade === 'generic') continue; const info = cropInfo(c, mode); if (!info.plant.includes(S.m) || (mode === 'open' && info.ghOnly)) continue; rows.push({ c, info }); }
  const ord = { curated: 0, auto: 1, world: 2 }; rows.sort((x, y) => ord[x.info.grade] - ord[y.info.grade] || x.info.name.localeCompare(y.info.name));
  const upcoming = {}; D.catalog.forEach(c => { if (c.grade === 'generic') return; const info = cropInfo(c, mode); if (mode === 'open' && info.ghOnly) return; for (let k = 1; k <= 3; k++) { const mm = (S.m - 1 + k) % 12 + 1; if (info.plant.includes(mm) && !info.plant.includes(S.m)) { (upcoming[mm] ||= []).push(info.name); break; } } });
  card(t(`[${pi+1}번 밭 · ${R.soil[p.soil].ko}${mode === 'gh' ? ' · 하우스' : ''}] ${S.m}월에 심을 수 있는 작물 — 번호로 고르거나 이름을 직접 쓰세요`, `[Field ${pi+1} · ${R.soil[p.soil].en}${mode === 'gh' ? ' · greenhouse' : ''}] Crops you can plant in month ${S.m} — pick a number or type a name`));
  if (!rows.length) npc(NPC.chief(), t('이달엔 심을 게 없어요. ' + Object.entries(upcoming).map(([m, ns]) => `${m}월: ${ns.slice(0, 5).join(', ')}`).join(' / '), 'Nothing to plant this month. ' + Object.entries(upcoming).map(([m, ns]) => `M${m}: ${ns.slice(0, 5).join(', ')}`).join(' / ')));
  const tag = g => ({ curated: '', auto: t(' ·설계값', ' ·design'), world: t(' ·해외', ' ·overseas') })[g];
  ask(rows.slice(0, 20).map(({ c, info }) => ({ label: `${info.name}${tag(info.grade)} — ${info.dur}${t('개월', ' mo')}, ${man(plantCost(info, 'full'))}`, fn: () => cmdPlant([c.name, String(pi+1)]) })).concat([{ label: t('그만둔다', 'Cancel'), fn: prompt }]), x => cmdPlant([x, String(pi+1)])); }
function unknownCrop(q, pi){ npc(NPC.chief(), t(`"${q}"… 그 작물은 우리 자료에 없어요. 어떤 종류에 가까워요?`, `"${q}"… not in our records. What kind of crop is it closest to?`)); ask(Object.entries(CAT).map(([k, g]) => ({ label: g[LANG], fn: () => { const c = { name: q, grade: 'generic', cat: k }; D.catalog.push(c); const info = cropInfo(c, S.plots[pi].mode === 'gh' ? 'gh' : 'open'); say(t(`(${q}: ${g.ko} 평균값으로 봅니다 — 설계값)`, `(${q}: treated as an average ${g.en} — design value)`), 'sys'); if (!info.plant.includes(S.m)) { npc(NPC.chief(), t(`${g.ko}는 보통 ${info.plant.join('·')}월에 심어요.`, `A ${g.en} is usually planted in month ${info.plant.join('·')}.`)); return prompt(); } describeCrop(info, S.plots[pi]); askPlantOptions(pi, info); } })), null); }
function describeCrop(info, p){ const tp = info.temps, exp0 = info.yld * R.area10a * soilK(p, info), exp = exp0 < 10 ? Math.round(exp0 * 10) / 10 : Math.round(exp0);
  card(t(`${info.name} — ${gradeLabel(info.grade)}\n수확까지 ${info.dur}개월 · 기대 수량 ${exp.toLocaleString()}kg(300평, ${R.soil[p.soil].ko}) · 경영비 ${man(info.cost)}/300평 · 수확기 예상 농가수취가 ${perKg(basePrice(info, (S.m + info.dur - 1) % 12 + 1) * (1 - D.const.farmgate_margin_rate))}\n생육 적온 ${tp.opt ? tp.opt.join('~') + '℃' : '?'} · 저온 한계 ${tp.low ?? '?'}℃ · 동해 ${tp.freeze ?? '자료 없음'} · 고온 ${tp.high ?? tp.heat ?? '?'}℃${tp.src && tp.src.low ? '  (' + tp.src.low + ')' : ''}${info.note ? '\n' + info.note : ''}${info.grade === 'world' && !info.priceHint ? '\n가격 자료 없음 → 설계값 ' + R.genericPrice.toLocaleString() + '원/kg' : ''}${info.sources ? '\n출처: ' + info.sources.slice(0, 2).join(' , ') : ''}`,
  `${info.name} — ${gradeLabel(info.grade)}\nHarvest in ${info.dur} mo · expected yield ${exp.toLocaleString()}kg (0.1 ha, ${R.soil[p.soil].en}) · cost ${man(info.cost)} per field · expected farm-gate price at harvest ${perKg(basePrice(info, (S.m + info.dur - 1) % 12 + 1) * (1 - D.const.farmgate_margin_rate))}\nOptimum ${tp.opt ? tp.opt.join('–') + '℃' : '?'} · cold limit ${tp.low ?? '?'}℃ · frost kill ${tp.freeze ?? 'no data'} · heat ${tp.high ?? tp.heat ?? '?'}℃${tp.src && tp.src.low ? '  (' + tp.src.low + ')' : ''}${info.note ? '\n' + info.note : ''}${info.grade === 'world' && !info.priceHint ? '\nNo price data → design value $' + (R.genericPrice / FX).toFixed(2) + '/kg' : ''}${info.sources ? '\nSources: ' + info.sources.slice(0, 2).join(' , ') : ''}`)); }
function doPlant(pi, info, fert, pest = 'conv'){ const p = S.plots[pi], cost = plantCost(info, fert, pest); if (S.flags.everPesticide === undefined) S.flags.everPesticide = false; if (pest !== 'none') S.flags.everPesticide = true; pay(cost, info.name); p.crop = info.key; p.info = info; p.fert = fert; p.pest = pest; p.pestHits = 0; p.dur = info.dur; p.el = 0; p.dmg = 1; p.kind = 'none'; p.cost = cost; p.notes = []; p.cover = false; p.stake = false; p.nutri = []; p.nutriBonus = 0; p.nutriSaved = 0; SFX.ok(); say(t(`${pi+1}번 밭에 ${J(info.name,'을','를')} 심었다. 경영비 ${man(cost)} (비료 ${R.fert[fert].ko}, ${R.pesticide[pest].ko}). ${info.dur}개월 뒤 수확 예정.`, `Planted ${info.name} in field ${pi+1}. Cost ${man(cost)} (fertilizer ${R.fert[fert].en}, ${R.pesticide[pest].en}). Harvest in ${info.dur} months.`)); status();
  if (S.m <= 4 && info.temps.low != null && MON()[S.m % 12].tmin < info.temps.low) return missionFrost(pi);
  if (!S.flags.nutriIntro) { S.flags.nutriIntro = 1; return missionNutriIntro(pi); } prompt(); }
function cmdFert(a){ const i = parseInt(a[0]) - 1; if (isNaN(i)) { const c = S.plots.map((p, k) => p.crop ? k : -1).filter(k => k >= 0); if (!c.length) { say(t('작물이 자라는 밭이 없습니다.', 'No field has a crop.'), 'sys'); return prompt(); } return pickField(c, t('어느 밭의 비료를 바꿀까요?', 'Which field?'), k => cmdFert([String(k+1)])); } const p = S.plots[i]; if (!p || !p.crop) { say(t('비료 [밭번호] — 작물이 있는 밭', 'fert [field] — a field with a crop'), 'sys'); return prompt(); } ask(Object.entries(R.fert).map(([k, f]) => ({ label: t(`${f.ko} (수량 ${f.k*100}%)`, `${f.en} (yield ${f.k*100}%)`), fn: () => { const d = plantCost(p.info, k, p.pest || 'conv') - plantCost(p.info, p.fert, p.pest || 'conv'); if (d > 0) { pay(d, t('비료 추가', 'extra fertilizer')); p.cost += d; } p.fert = k; say(t(`${i+1}번 밭 비료·농약: ${f.ko}`, `Field ${i+1} fertilizer: ${f.en}`)); status(); prompt(); } }))); }

function applyNutri(i, k){ const p = S.plots[i], n = R.nutri[k]; pay(n.cost, n[LANG]); S.nutriSpent += n.cost; p.cost += n.cost; p.nutri.push(k); if (n.yield) p.nutriBonus += n.yield; SFX.ok();
  const exp = p.info.yld * R.area10a * soilK(p, p.info) * R.fert[p.fert].k; const pr = basePrice(p.info, (S.m + p.dur - p.el - 1) % 12 + 1) * (1 - D.const.farmgate_margin_rate);
  say(t(`${i+1}번 밭 ${p.info.name}에 ${J(n.ko,'을','를')} 줬다. (${man(n.cost)})`, `Applied ${n.en} to ${p.info.name} in field ${i+1}. (${man(n.cost)})`));
  if (n.yield) card(t(`  예상 효과(설계값): 수량 ${Math.round(exp)}kg → ${Math.round(exp * (1 + p.nutriBonus))}kg (+${Math.round(exp * n.yield)}kg) ≈ +${man(exp * n.yield * pr)} / 투입 ${man(n.cost)}`, `  Expected effect (design value): yield ${Math.round(exp)}kg → ${Math.round(exp * (1 + p.nutriBonus))}kg (+${Math.round(exp * n.yield)}kg) ≈ +${man(exp * n.yield * pr)} / cost ${man(n.cost)}`));
  else card(t(`  예상 효과(설계값): 이 밭의 저온·고온·가뭄 피해율이 ${n.dmgCut*100}% 줄어든다. 수확 때 "피해 경감"으로 금액을 보여준다.`, `  Expected effect (design value): cold, heat and drought damage on this field is cut by ${n.dmgCut*100}%. Shown as "damage avoided" at harvest.`)); status(); }
function missionNutriIntro(pi){ const p = S.plots[pi], n = R.nutri.root; card(t('[미션] 영양제 영업 — 오리 상인이 밭머리에 트럭을 세웠다.', '[Mission] The nutrient salesman — the duck trader parks his truck by the field.')); npc(NPC.duck(), t(`새로 심으셨네요! ${n.ko} 한 병 어때요? ${n.ko_d}. 밭 한 칸(300평)에 ${man(n.cost)}. 효과는 게임 설계값이지, 어느 회사 제품 시험 성적이 아닌 건 미리 말씀드려요.`, `Fresh planting! How about a bottle of ${n.en}? ${n.en_d}. ${man(n.cost)} per field. Fair warning: the effect is a game design value, not any company's trial result.`));
  ask([{ label: t(`산다 (${man(n.cost)}, 수량 +${n.yield*100}%)`, `Buy (${man(n.cost)}, yield +${n.yield*100}%)`), fn: () => { applyNutri(pi, 'root'); prompt(); } }, { label: t('나중에 "영양제"로 다시 본다', 'Later ("nutrient" command)'), fn: prompt }]); }
function cmdNutri(){ const live = S.plots.map((p, i) => p.crop ? i : -1).filter(i => i >= 0);
  card(t('[영양제 상점] 효과는 설계값(가정)이며 실제 제품의 시험 성적이 아닙니다. 밭 1칸(300평) 기준 가격.', '[Nutrient shop] Effects are design assumptions, not trial results for any real product. Price per field (0.1 ha).'));
  if (!live.length) { npc(NPC.duck(), t('작물이 자라는 밭이 있어야 쓸 수 있어요.', 'You need a growing crop first.')); return prompt(); }
  ask(Object.entries(R.nutri).map(([k, n]) => ({ label: t(`${n.ko} ${man(n.cost)} — ${n.ko_d}`, `${n.en} ${man(n.cost)} — ${n.en_d}`), fn: () => pickPlot(k) })).concat([{ label: t('나간다', 'Leave'), fn: prompt }]));
  function pickPlot(k){ const n = R.nutri[k]; ask(live.map(i => { const p = S.plots[i]; const st = stageOf(p); const okWhen = n.when == null || st <= n.when; const used = p.nutri.includes(k); return { label: t(`${i+1}번 밭 ${p.info.name} (${st}/4단계)${used ? ' — 이미 사용' : !okWhen ? ' — 시기 지남' : ''}`, `Field ${i+1} ${p.info.name} (stage ${st}/4)${used ? ' — already applied' : !okWhen ? ' — too late' : ''}`), fn: () => { if (used || !okWhen) { npc(NPC.duck(), used ? t('그 밭엔 이미 줬어요.', 'Already applied there.') : t(`${n.ko}는 ${n.when}단계까지만 효과가 있어요.`, `${n.en} only works up to stage ${n.when}.`)); return prompt(); } applyNutri(i, k); prompt(); } }; }).concat([{ label: t('뒤로', 'Back'), fn: cmdNutri }])); } }
function cmdCropInfo(q){ const c = findCrop(q); if (!c) { npc(NPC.chief(), t(`"${q}"는 자료에 없어요. 심을 때 종류를 골라 주면 평균값으로 봅니다.`, `"${q}" isn't in our records. Pick a category when planting and I'll use averages.`)); return prompt(); } describeCrop(cropInfo(c, 'open'), S.plots[1]); prompt(); }
function cmdSubsidy(){ if (S.m !== 1) { npc(NPC.otter(), t('보조사업 신청은 1월에만 받아요.', 'Subsidy applications are January only.')); return prompt(); } if (S.subsidyTried === S.y) { npc(NPC.otter(), t('올해는 이미 신청했어요.', 'You already applied this year.')); return prompt(); } S.subsidyTried = S.y; const ok = rng() < R.house.subsidyP; S.houseSub = ok; npc(NPC.otter(), ok ? t('축하해요! 하우스 보조사업에 선정됐어요. 올해 안에 "하우스"로 짓는 첫 한 동의 설치비 50%를 보조받습니다.', 'Congratulations, you got the greenhouse subsidy: 50% of the cost of the first house you build this year with "house".') : t('아쉽지만 올해는 떨어졌어요. 내년 1월에 다시 신청하거나 전액 자부담으로 지을 수 있어요.', 'Not selected this year. Apply again next January or build at full cost.')); if (ok) SFX.ok(); else SFX.bad(); prompt(); }
function cmdHouse(){ const cands = S.plots.map((p, i) => p.tilled && p.mode !== 'gh' ? i : -1).filter(i => i >= 0); if (!cands.length) { npc(NPC.otter(), t('하우스를 올릴 수 있는 밭(개간됐고 아직 하우스가 없는 밭)이 없어요.', 'No field is ready for a greenhouse (needs to be tilled and not already covered).')); return prompt(); }
  const own = S.houseSub ? R.house.cost * (1 - R.house.subsidyRate) : R.house.cost; const need = Math.max(0, own - S.cash); if (need > R.loan.policyMax - S.policy) { npc(NPC.otter(), t('현금과 창업자금 한도를 합쳐도 모자라요.', 'Even with the start-up loan limit you cannot afford it.')); return prompt(); }
  npc(NPC.otter(), t(`단동 하우스 한 동(300평) ${man(R.house.cost)}${S.houseSub ? ', 보조 50% 적용 → 자부담 ' + man(own) : ''}${need ? ', 부족분 ' + man(need) + '은 창업자금' : ''}. 어느 밭에 올릴까요? (여러 동 가능, 보조는 선정된 해의 첫 한 동만)`, `One single-span greenhouse (0.1 ha) costs ${man(R.house.cost)}${S.houseSub ? ', 50% subsidy → your share ' + man(own) : ''}${need ? ', shortfall ' + man(need) + ' from the start-up loan' : ''}. Which field? (several allowed; the subsidy covers only the first one in the year you were selected)`));
  pickField(cands, t('하우스를 올릴 밭', 'Field for the greenhouse'), i => { if (need) { S.policy += need; S.cash += need; } S.cash -= own; S.house = true; (S.houses ||= []).push({ i, cost: own, month: S.t }); S.houseCost = (S.houseCost || 0) + own; S.houseSub = false; S.plots[i].mode = 'gh'; if (S.plots[i].crop) S.plots[i].info = cropInfo(findCrop(S.plots[i].crop) || D.catalog.find(c => c.key === S.plots[i].crop), 'gh'); SFX.ok(); say(t(`${i+1}번 밭에 단동 하우스(300평)를 올렸다. 이 밭은 기온 피해가 없고 시설 작형을 심을 수 있다. 5℃ 미만인 달엔 동당 난방비 ${man(R.heating * R.area10a)}.`, `A single-span greenhouse (0.1 ha) now covers field ${i+1}. No temperature damage there and greenhouse crops are allowed. Heating costs ${man(R.heating * R.area10a)} per house in months under 5℃.`)); status(); checkAch(); prompt(); }); }

  const fb = document.createElement('a'); fb.href = 'https://github.com/touch98ce-jpg/global_crop_guide/issues'; fb.target = '_blank'; fb.rel = 'noopener'; fb.textContent = t('💬 의견 보내기 (GitHub Issues)', '💬 Send feedback (GitHub Issues)'); fb.style.cssText = 'display:inline-block;margin:4px 0;color:var(--dim)'; box.appendChild(fb);

(function fitViewport(){ const vv = window.visualViewport; if (!vv) return; const main = document.querySelector('main'); let raf = 0, base = vv.height;
  const fit = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { const h = Math.round(vv.height); if (h > base) base = h; const kbd = h < base * .8; document.documentElement.classList.toggle('kbd', kbd);
    // iOS는 키보드가 뜨면 고정 요소까지 위로 밀어 올린다 → 보이는 영역(visualViewport)의 위치·크기로 main을 옮기고 줄인다

async function loadRegionQuiet(region){ try { const r = await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${region.lat}&longitude=${region.lon}&start_date=2014-01-01&end_date=2023-12-31&daily=temperature_2m_mean,temperature_2m_min,temperature_2m_max,precipitation_sum&timezone=auto`); const d = (await r.json()).daily; const acc = Array.from({length: 12}, () => ({ ta: 0, tmin: 0, tmax: 0, rain: 0, n: 0, yrs: new Set() })); d.time.forEach((day, i) => { const m = +day.slice(5, 7) - 1, a = acc[m]; if (d.temperature_2m_mean[i] == null) return; a.ta += d.temperature_2m_mean[i]; a.tmin += d.temperature_2m_min[i]; a.tmax += d.temperature_2m_max[i]; a.rain += d.precipitation_sum[i] || 0; a.n++; a.yrs.add(day.slice(0, 4)); }); region.months = acc.map((a, i) => ({ m: i + 1, ta: +(a.ta / a.n).toFixed(1), tmin: +(a.tmin / a.n).toFixed(1), tmax: +(a.tmax / a.n).toFixed(1), rain: Math.round(a.rain / a.yrs.size) })); } catch (e) { region.months = null; } }
